webservice:
  url: "http://0.0.0.0:8080"
  prefix: "/api/angry-agent/v1"
auth:
  jwt_public_key: "REPLACE_WITH_KEYCLOAK_RS256_PUBLIC_KEY"
  jwt_issuer: "https://keycloak.example.com/realms/your-realm"
  jwt_audience: "angry-agent-api"
persistence:
  db:
    connection:
      url: "postgresql://localhost:5432/agentdb"
main_aiclient:
  model_provider: "ollama"
  model: "llama2"
packager_aiclient:
  model_provider: "ollama"
  model: "llama2"
embedding_client:
  model_provider: "ollama"
  model: "llama2"
