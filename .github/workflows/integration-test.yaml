name: Integration Tests
on:
  pull_request:
    branches: [main]

concurrency:
  group: k8s-integration-env
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  integration:
    runs-on: polecatworks-runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure and Check Kubeconfig
        run: |
          # Configure a local context for the ServiceAccount
          kubectl config set-cluster local --server=https://kubernetes.default.svc --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-credentials runner --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context local --cluster=local --user=runner
          kubectl config use-context local

          echo "Kubernetes access check:"
          kubectl get nodes || echo "Warning: Could not list nodes. Check ClusterRole permissions."
          kubectl config view
          kubectl config get-contexts

      - name: Install GitHub CLI
        run: |
          GH_VERSION=$(curl -s https://api.github.com/repos/cli/cli/releases/latest | jq -r .tag_name | sed 's/v//')
          curl -sSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o gh.tar.gz
          tar xzf gh.tar.gz
          # Move it to a folder in your PATH (like /usr/local/bin) or just add it to GITHUB_PATH
          sudo mv gh_${GH_VERSION}_linux_amd64/bin/gh /usr/local/bin/
          gh --version

      # THIS IS BROKEN
      # - name: Install GitHub CLI
      #   uses: actions4gh/setup-gh@v1

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Run Integration Tests with Garden
        uses: garden-io/garden-action@v2
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GARDEN_KUBECONTEXT: local
        with:
          # garden-version: "0.14.20"
          command: test --env pr

      - name: Rollback Database Schema
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          NAMESPACE="angry-agent-pr-${PR_NUMBER}"
          echo "Finding backend pod in namespace: $NAMESPACE"
          # Find the running backend pod to use its volume mounts and context for rollback
          POD_NAME=$(kubectl get pods -n $NAMESPACE -l component=service-pod --no-headers -o custom-columns=":metadata.name" | head -n 1)

          if [ -n "$POD_NAME" ]; then
            echo "Running rollback migration in pod: $POD_NAME"
            kubectl exec -n $NAMESPACE $POD_NAME -c agent-be -- python -m src.cli migrate --action rollback --config /opt/app/configs/config.yaml --secrets /opt/app/secrets
          else
            echo "No agent-be pod found. Skipping rollback or environment already clean."
          fi

      - name: Teardown Garden Environment
        uses: garden-io/garden-action@v2
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GARDEN_KUBECONTEXT: local
        with:
          command: delete environment --env pr --force
 
